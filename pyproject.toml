[project]
name = "mediacore-studio-gateway"
version = "0.1.0"
description = "MediaCore Studio Gateway — studio-resident playout agent (Phase 2: delivery core)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "psutil>=5.9",
]

# Tier C audio monitoring (metering + silence/dead-air). Opt-in — heavy native
# wheels — install with: pip install '.[audio]'
[project.optional-dependencies]
audio = [
    "numpy>=1.26",
    "sounddevice>=0.4",
]
# As-aired transcription (Whisper). Opt-in — install with: pip install '.[whisper]'
whisper = [
    "faster-whisper>=1.0",
]

[project.scripts]
mediacore-gateway = "gateway.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gateway*"]
